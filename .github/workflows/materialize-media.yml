name: Materialize media assets
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/media-manifest.json"
      - ".github/workflows/materialize-media.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download media from staged URLs and commit
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os, hashlib, urllib.request, subprocess, glob

          for p in glob.glob("**/*.b64.*", recursive=True):
              os.remove(p)
              print("removed", p)
          for p in [
              "public/.verify-mcp-roundtrip.txt",
              "public/.b64-test.bin",
              "public/.binary-smoke.jpg",
              "public/.latin1-test.bin",
              "public/.mini-test.jpg.b64",
              "public/.upload-smoke.txt",
          ]:
              if os.path.exists(p):
                  os.remove(p)
                  print("removed", p)

          manifest = json.load(open("scripts/media-manifest.json"))
          for dest, meta in sorted(manifest.items()):
              url = meta["url"]
              expected_md5 = meta["md5"]
              expected_size = meta["size"]
              print(f"fetch {dest} from {url}")
              req = urllib.request.Request(url, headers={"User-Agent": "mythic-mixtape-materialize"})
              with urllib.request.urlopen(req, timeout=180) as r:
                  data = r.read()
              md5 = hashlib.md5(data).hexdigest()
              if md5 != expected_md5 or len(data) != expected_size:
                  raise SystemExit(
                      f"hash/size mismatch for {dest}: got {len(data)}/{md5} want {expected_size}/{expected_md5}"
                  )
              os.makedirs(os.path.dirname(dest) or ".", exist_ok=True)
              open(dest, "wb").write(data)
              print(f"wrote {dest} ({len(data)} bytes)")

          if os.path.exists("scripts/media-manifest.json"):
              os.remove("scripts/media-manifest.json")

          subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
          subprocess.check_call(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          subprocess.check_call(["git", "add", "-A"])
          st = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if st.returncode == 0:
              print("no git changes")
              raise SystemExit(0)
          subprocess.check_call(["git", "commit", "-m", "Materialize binary media assets"])
          subprocess.check_call(["git", "push"])
          PY
